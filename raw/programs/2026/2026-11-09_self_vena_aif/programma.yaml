      - {nome: "Cable row", tipo: compl, serie_ced: 1, serie_8: 2}
      - {nome: "Iliac pulldown / lat machine", tipo: compl, serie_ced: 1, serie_8: 2}
      - {nome: "Tricipiti al cavo", tipo: compl, serie_ced: 1, serie_8: 3}
